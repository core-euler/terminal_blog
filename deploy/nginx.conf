worker_processes auto;
events { worker_connections 1024; }

# Развод по SNI: наш домен — на сайт, всё остальное (в том числе www.vu.nl) — в xray.
stream {
    map $ssl_preread_server_name $blog_backend {
        coreeuler.art      127.0.0.1:9443;
        www.coreeuler.art  127.0.0.1:9443;
        default            127.0.0.1:14443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $blog_backend;
        proxy_connect_timeout 5s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Сжатие: страницы весят до 280 КБ из-за инлайновых стилей подсветки кода.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Старые адреса: слаги переименовывались дважды, потом сменились категории.
    # Ключ — уже разобранный URI, поэтому кириллица здесь живая, а не в percent-кодировке.
    # Кириллические ключи вдвое длиннее в байтах — дефолтной корзины не хватает.
    map_hash_bucket_size 128;
    map_hash_max_size 8192;
