worker_processes auto;
events { worker_connections 1024; }

# Развод по SNI: наш домен — на сайт, всё остальное (в том числе www.vu.nl) — в xray.
stream {
    map $ssl_preread_server_name $blog_backend {
        coreeuler.art      127.0.0.1:9443;
        www.coreeuler.art  127.0.0.1:9443;
        default            127.0.0.1:14443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $blog_backend;
        proxy_connect_timeout 5s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Сжатие: страницы весят до 280 КБ из-за инлайновых стилей подсветки кода.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # 80 — только ACME и редирект; валидация Let's Encrypt ходит сюда.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name coreeuler.art www.coreeuler.art _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://coreeuler.art$request_uri; }
    }

    # Сайт: TLS терминируется здесь, наружу порт 443 отдаёт stream выше.
    server {
        listen 127.0.0.1:9443 ssl;
        http2 on;
        server_name coreeuler.art www.coreeuler.art;
        ssl_certificate     /etc/letsencrypt/live/coreeuler.art/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/coreeuler.art/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($host = www.coreeuler.art) { return 301 https://coreeuler.art$request_uri; }
        root /srv/site;
        index index.html;
        error_page 404 /404.html;
        # Редиректы отдаём относительными: наружу открыт 443, а сайт слушает 9443,
        # иначе абсолютный Location уводил бы клиента на недоступный порт.
        absolute_redirect off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # Старые адреса: слаги переименованы в названия статей.
        # location пишется декодированным: nginx сравнивает его с уже разобранным URI,
        # а percent-кодировка в конфиге не совпала бы ни с одним запросом.

        location = /posts/ai/120-тысяч-фотографий/ { return 301 /posts/ai/%D1%80%D0%B0%D0%B7%D0%BE%D0%B1%D1%80%D0%B0%D1%82%D1%8C-120-%D1%82%D1%8B%D1%81%D1%8F%D1%87-%D1%84%D0%BE%D1%82%D0%BE%D0%B3%D1%80%D0%B0%D1%84%D0%B8%D0%B9/; }
