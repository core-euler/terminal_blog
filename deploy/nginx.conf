    # 80 — только ACME и редирект; валидация Let's Encrypt ходит сюда.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name coreeuler.art www.coreeuler.art _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://coreeuler.art$request_uri; }
    }

    # Сайт: TLS терминируется здесь, наружу порт 443 отдаёт stream выше.
    server {
        listen 127.0.0.1:9443 ssl;
        http2 on;
        server_name coreeuler.art www.coreeuler.art;
        ssl_certificate     /etc/letsencrypt/live/coreeuler.art/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/coreeuler.art/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($host = www.coreeuler.art) { return 301 https://coreeuler.art$request_uri; }
        root /srv/site;
        index index.html;
        error_page 404 /404.html;
        # Редиректы отдаём относительными: наружу открыт 443, а сайт слушает 9443,
        # иначе абсолютный Location уводил бы клиента на недоступный порт.
        absolute_redirect off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # Старые адреса живут в map выше: одно правило — одна строка.
        if ($moved_to) { return 301 $moved_to; }

        location / { try_files $uri $uri/ =404; }
        location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
        # Имя без хеша: держим короткий срок, чтобы правка палитры доезжала сразу.
        location = /shiki.css {
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "public, max-age=300";
        }
        location = /favicon.svg {
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "public, max-age=604800";
        }
    }
}
