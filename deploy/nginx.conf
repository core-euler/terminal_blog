worker_processes auto;
events { worker_connections 1024; }

# Развод по SNI: наш домен — на сайт, всё остальное (в том числе www.vu.nl) — в xray.
stream {
    map $ssl_preread_server_name $blog_backend {
        coreeuler.art      127.0.0.1:9443;
        www.coreeuler.art  127.0.0.1:9443;
        default            127.0.0.1:14443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $blog_backend;
        proxy_connect_timeout 5s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # 80 — только ACME и редирект; валидация Let's Encrypt ходит сюда.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name coreeuler.art www.coreeuler.art _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://coreeuler.art$request_uri; }
    }

    # Сайт: TLS терминируется здесь, наружу порт 443 отдаёт stream выше.
    server {
        listen 127.0.0.1:9443 ssl;
        http2 on;
        server_name coreeuler.art www.coreeuler.art;
        ssl_certificate     /etc/letsencrypt/live/coreeuler.art/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/coreeuler.art/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        if ($host = www.coreeuler.art) { return 301 https://coreeuler.art$request_uri; }
        root /srv/site;
        index index.html;
        error_page 404 /404.html;
        location / { try_files $uri $uri/ =404; }
        location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    }
}
